name: build and tests

# The shared server CI of Snail.Sdk: the tests, the reference and conformance, and the native program built for each
# platform it ships to, without a trim or AOT warning, then asked over stdio and at an address where it runs — every
# contract test, the shared workflow's filter.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      contract-variable: SNAIL_DOCUMENTS_SERVER
